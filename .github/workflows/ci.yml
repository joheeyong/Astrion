name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any prior in-flight CI run for the same ref. Saves runner
# minutes when commits land back-to-back.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-build:
    name: server build + version sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Pin JDK to match what the deploy.sh deploys against (the EC2 box
      # runs OpenJDK 21 from the Ubuntu 24.04 default; the project
      # build.gradle targets Java 17 source/target which 21 happily
      # compiles). Using Temurin for reproducibility.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # v3 of the standalone action is deprecated; gradle/actions is the
      # maintained home. Validation needs services.gradle.org for the
      # checksum list — a runner-side network blip here failed the whole
      # job once, so don't be surprised by transient reds on this step.
      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # The :common:checkVersionSync task verifies that root build.gradle
      # version + Version.java + Version.cs all agree. Catching a drift
      # here keeps the worldmap-version handshake working at deploy time.
      - name: Version sync check
        run: ./gradlew :common:checkVersionSync --no-daemon

      # Server JUnit suite (PlayerStateLocksTest etc.). Failures here block
      # the deploy artifact below — a broken lock invariant is the kind of
      # silent damage we don't want to ship to prod.
      - name: Run server tests
        run: ./gradlew :game-server:test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: game-server/build/reports/tests/test/
          retention-days: 7

      # game-server distTar is what deploy.sh ships to EC2; if it builds
      # locally and packages, the deploy step won't surprise us.
      - name: Build game-server
        run: ./gradlew :game-server:distTar --no-daemon

      - name: Upload server tar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-server-${{ github.sha }}.tar
          path: game-server/build/distributions/game-server-*.tar
          retention-days: 7

  e2e-smoke:
    name: e2e smoke (friend→party→trade)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Real Redis next to the runner — the harness boots the actual server
    # in-JVM and two bot clients drive the social stack over real TCP.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run E2E smoke
        run: ./gradlew :game-server:e2eTest --no-daemon

      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-report
          path: game-server/build/reports/tests/e2eTest/
          retention-days: 7

  shell-scripts:
    name: shell script syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - name: bash -n every .sh in deploy/ and root deploy.sh
        run: |
          set -e
          fail=0
          for f in deploy/*.sh deploy.sh bump-version.sh; do
              [[ -f "$f" ]] || continue
              if ! bash -n "$f"; then
                  echo "::error file=$f::bash -n failed"
                  fail=1
              fi
          done
          exit $fail
