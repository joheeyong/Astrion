name: Deploy (manual)

# Manual trigger only — never auto-deploy on push. The operator clicks
# 'Run workflow' in the Actions tab when they want to ship.
# See docs/CI-CD.md for the secrets the maintainer needs to add before
# this workflow can succeed.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy mode'
        type: choice
        default: full
        options: [full, no-build, restart-only]

jobs:
  deploy:
    name: build + ship + restart prod
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Environment guard. 'prod' environment in the repo settings can be
    # configured to require a manual approval before the job runs — see
    # docs/CI-CD.md for how to set that up. With no environment configured
    # the job runs immediately.
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install SSH key from secret
        env:
          SSH_KEY: ${{ secrets.ASTRION_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/astrion-key.pem
          chmod 600 ~/.ssh/astrion-key.pem
          # Don't print the key. Just confirm it's a usable file.
          ssh-keygen -lf ~/.ssh/astrion-key.pem || (echo "::error::SSH key invalid"; exit 1)

      - name: Run deploy.sh
        env:
          ASTRION_SSH_KEY: /home/runner/.ssh/astrion-key.pem
        run: |
          set -e
          case "${{ inputs.mode }}" in
            full)         ./deploy.sh                ;;
            no-build)     ./deploy.sh --no-build     ;;
            restart-only) ./deploy.sh --restart-only ;;
          esac
